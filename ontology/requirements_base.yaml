# ============================================================================
# SEA Platform — Base Requirements Ontology (LinkML)
# ============================================================================
# A generic, domain-agnostic ontology for business requirement analysis.
# Covers Business/Functional aspects and Non-Functional/Quality Attributes.
# Aligned with ISO 25010 (quality), BABOK (business analysis), and TOGAF (EA).
#
# Domain-specific ontologies (e.g., Payment Processing) EXTEND this base.
# ============================================================================

id: https://sea.platform/ontology/requirements-base
name: requirements-base
title: SEA Base Requirements Ontology
version: 0.1.0
description: >-
  Generic ontology for structured business requirement analysis of any
  product or system. Covers functional requirements, business context,
  non-functional quality attributes, constraints, and traceability links.

license: Apache-2.0
default_curi_maps:
  - semweb_context

prefixes:
  linkml: https://w3id.org/linkml/
  sea-req: https://sea.platform/ontology/requirements-base/
  schema: https://schema.org/
  dcterms: http://purl.org/dc/terms/
  iso25010: https://iso25010.org/

default_prefix: sea-req
default_range: string

imports:
  - linkml:types
  - enterprise_structure
  - sea_common

# ============================================================================
# ENUMERATIONS
# ============================================================================

enums:

  RequirementType:
    description: High-level classification of a requirement.
    permissible_values:
      BUSINESS:
        description: Strategic business need or objective translation.
      FUNCTIONAL:
        description: Behavioral capability the system must provide.
      NON_FUNCTIONAL:
        description: Quality attribute or constraint on the system.
      CONSTRAINT:
        description: Hard limit or non-negotiable restriction.

  RequirementPriority:
    description: Priority ranking using the MoSCoW method.
    permissible_values:
      MUST_HAVE:
        description: Non-negotiable for delivery.
      SHOULD_HAVE:
        description: Important but not critical; workaround exists.
      COULD_HAVE:
        description: Desirable if time and budget allow.
      WONT_HAVE:
        description: Explicitly excluded from this scope.

  RequirementStatus:
    description: Lifecycle state of a requirement.
    permissible_values:
      DRAFT:
        description: Initial capture, not yet reviewed.
      IN_REVIEW:
        description: Under active review by stakeholders.
      APPROVED:
        description: Formally accepted and baselined.
      DEFERRED:
        description: Acknowledged but postponed to a future scope.
      REJECTED:
        description: Declined with documented rationale.
      OBSOLETE:
        description: Previously valid but no longer applicable.

  QualityAttributeCategory:
    description: >-
      The nine product quality CHARACTERISTICS of ISO/IEC 25010:2023 (SQuaRE).

      Strictly the 2023 model: Usability was renamed Interaction Capability and
      Portability was replaced by Flexibility, which is why `FLEXIBILITY` appears
      here and `PORTABILITY` does not. Naming a category after a superseded
      edition is worse than a gap — it silently classifies Scalability under a
      characteristic the standard no longer has.

      This enum is the TOP level only. The ~40 sub-characteristics live in
      `QualitySubcharacteristic`, and both are attached to `QualityAttribute`
      instances so a quality concern has an identity rather than being a bare
      string on a requirement.
    permissible_values:
      FUNCTIONAL_SUITABILITY:
        description: Completeness, correctness, appropriateness of functions.
      PERFORMANCE_EFFICIENCY:
        description: Time behaviour, resource utilization, capacity.
      COMPATIBILITY:
        description: Co-existence, interoperability with other systems.
      INTERACTION_CAPABILITY:
        description: >-
          Appropriateness recognizability, learnability, operability, user error
          protection, user engagement, inclusivity, user assistance,
          self-descriptiveness. Named "Usability" before the 2023 revision.
      RELIABILITY:
        description: Faultlessness, availability, fault tolerance, recoverability.
      SECURITY:
        description: >-
          Confidentiality, integrity, non-repudiation, accountability,
          authenticity, resistance.
      MAINTAINABILITY:
        description: Modularity, reusability, analysability, modifiability, testability.
      FLEXIBILITY:
        description: >-
          Adaptability, scalability, installability, replaceability. Replaced
          Portability in the 2023 revision — this is the home of scalability.
      SAFETY:
        description: >-
          Operational constraint, risk identification, fail safe, hazard warning,
          safe integration.
      REGULATORY_COMPLIANCE:
        description: >-
          Adherence to legal, industry or contractual mandates — PCI-DSS, GDPR,
          an internal standard, an SLA. NOT an ISO/IEC 25010 characteristic; it
          is carried because enterprise architecture needs it, and
          `QualityConcernClass` records that it comes from governance rather than
          from the product quality model. Every other value here is ISO 25010.

  QualitySubcharacteristic:
    description: >-
      ISO/IEC 25010:2023 sub-characteristics — the level the standard actually
      classifies at, and the level at which a design decision can be justified.

      Why this granularity matters: "within 500ms" and "1000 TPS with horizontal
      scaling" are both PERFORMANCE_EFFICIENCY at the characteristic level, but
      they are Time Behaviour and Scalability respectively — and they are
      satisfied by entirely different techniques (caching vs. statelessness plus
      replication). A model that stops at the top level cannot tell those apart,
      so it cannot check that a technique is aimed at the right concern.

      Values are grouped by their parent characteristic, in the same order, so
      the enum reads as the taxonomy it is.
    permissible_values:
      # -- Functional Suitability --
      FUNCTIONAL_COMPLETENESS:
        description: Functions cover all specified tasks and intended objectives.
      FUNCTIONAL_CORRECTNESS:
        description: The product provides accurate results.
      FUNCTIONAL_APPROPRIATENESS:
        description: Functions facilitate accomplishment of specified tasks.
      # -- Performance Efficiency --
      TIME_BEHAVIOUR:
        description: Response time and throughput meet requirements.
      RESOURCE_UTILIZATION:
        description: Amounts and types of resources used meet requirements.
      CAPACITY:
        description: Maximum limits of a product parameter meet requirements.
      # -- Compatibility --
      CO_EXISTENCE:
        description: Performs its functions while sharing an environment without detriment.
      INTEROPERABILITY:
        description: Exchanges information with other products and uses what was exchanged.
      # -- Interaction Capability --
      APPROPRIATENESS_RECOGNIZABILITY:
        description: Users can recognise whether the product suits their needs.
      LEARNABILITY:
        description: Functions can be learnt within a specified time.
      OPERABILITY:
        description: Attributes that make the product easy to operate and control.
      USER_ERROR_PROTECTION:
        description: The system prevents users from making operation errors.
      USER_ENGAGEMENT:
        description: The interface invites and motivates continued interaction.
      INCLUSIVITY:
        description: Usable by people of varied backgrounds, ages, abilities and languages.
      USER_ASSISTANCE:
        description: Usable across the widest range of characteristics and capabilities.
      SELF_DESCRIPTIVENESS:
        description: Capabilities and use are immediately obvious without excess interaction.
      # -- Reliability --
      FAULTLESSNESS:
        description: Performs specified functions without fault under normal operation.
      AVAILABILITY:
        description: Operational and accessible when required for use.
      FAULT_TOLERANCE:
        description: Operates as intended despite hardware or software faults.
      RECOVERABILITY:
        description: Recovers affected data and re-establishes the desired state after failure.
      # -- Security --
      CONFIDENTIALITY:
        description: Data accessible only to those authorised.
      INTEGRITY:
        description: State and data protected from unauthorised modification or deletion.
      NON_REPUDIATION:
        description: Actions or events can be proven to have taken place.
      ACCOUNTABILITY:
        description: Actions of an entity can be traced uniquely to it.
      AUTHENTICITY:
        description: The identity of a subject or resource can be proved.
      RESISTANCE:
        description: Sustains operations while under attack from a malicious actor.
      # -- Maintainability --
      MODULARITY:
        description: Composed of discrete components; change has minimal impact elsewhere.
      REUSABILITY:
        description: Usable as an asset in more than one system.
      ANALYSABILITY:
        description: Impact of a change can be assessed and deficiencies diagnosed.
      MODIFIABILITY:
        description: Modified effectively without introducing defects.
      TESTABILITY:
        description: Test criteria can be established and tests performed.
      # -- Flexibility --
      ADAPTABILITY:
        description: Adapted or transferred to different hardware, software or usage environments.
      SCALABILITY:
        description: Handles growing or shrinking workloads, or adapts capacity to variability.
      INSTALLABILITY:
        description: Successfully installed and/or uninstalled in a specified environment.
      REPLACEABILITY:
        description: Can replace another specified product for the same purpose.
      # -- Safety --
      OPERATIONAL_CONSTRAINT:
        description: Constrains operation within safe parameters on encountering hazard.
      RISK_IDENTIFICATION:
        description: Identifies courses of events that expose life, property or environment to risk.
      FAIL_SAFE:
        description: Places itself in a safe mode, or reverts to a safe condition, on failure.
      HAZARD_WARNING:
        description: Warns of unacceptable risks in time for operators to react.
      SAFE_INTEGRATION:
        description: Maintains safety during and after integration with other components.

  QualityConcernClass:
    description: >-
      Which quality model a `QualityAttributeCategory` belongs to.

      Exists because one of our values is NOT from ISO 25010.
      `REGULATORY_COMPLIANCE` is an enterprise-architecture concern we need —
      PCI-DSS, GDPR, internal standards — but the standard does not define it,
      and quietly folding it into an "ISO 25010" enum makes the enum's name a
      false claim. Splitting the axis keeps both honest: every category still
      declares which model it comes from.
    permissible_values:
      ISO_25010_2023:
        description: A product quality characteristic defined by ISO/IEC 25010:2023.
      ENTERPRISE_GOVERNANCE:
        description: >-
          Obligations that come from regulation, contract or internal standard
          rather than from a product quality model. Real, auditable, and
          deliberately not claimed as ISO 25010.

  ConstraintType:
    description: Category of hard constraint.
    permissible_values:
      REGULATORY:
        description: Legal or compliance mandate (e.g., GDPR, PCI-DSS).
      TECHNICAL:
        description: Technology or infrastructure limitation.
      BUSINESS:
        description: Budget, timeline, or organizational constraint.
      CONTRACTUAL:
        description: Obligation from a third-party agreement or SLA.
      STANDARD:
        description: Adherence to an industry or internal standard.

  StakeholderRole:
    description: The stakeholder's relationship to the system.
    permissible_values:
      SPONSOR:
        description: Funds and champions the initiative.
      PRODUCT_OWNER:
        description: Defines and prioritizes requirements.
      END_USER:
        description: Directly interacts with the system.
      OPERATOR:
        description: Manages day-to-day system operations.
      DEVELOPER:
        description: Builds or integrates the system.
      REGULATORY_BODY:
        description: Sets compliance requirements.
      EXTERNAL_SYSTEM:
        description: Interacting upstream or downstream system.

  ProcessType:
    description: Classification of a business process.
    permissible_values:
      CORE:
        description: Directly delivers value to the customer.
      SUPPORT:
        description: Enables core processes (e.g., HR, IT).
      MANAGEMENT:
        description: Governance, oversight, strategic direction.

  TriggerType:
    description: What initiates a process or use case.
    permissible_values:
      EVENT_EXTERNAL:
        description: Triggered by an external event or actor action.
      EVENT_TEMPORAL:
        description: Triggered by a schedule or time condition.
      EVENT_INTERNAL:
        description: Triggered by an internal system state change.

  ImpactLevel:
    description: Magnitude of impact for risk or change assessment.
    permissible_values:
      CRITICAL: { description: System failure or regulatory breach. }
      HIGH: { description: Major feature or workflow disruption. }
      MEDIUM: { description: Noticeable degradation with workaround. }
      LOW: { description: "Minor inconvenience, easily absorbed." }
      NEGLIGIBLE: { description: No meaningful effect. }

  MeasurementUnit:
    description: Common units for quality attribute measurement.
    permissible_values:
      MILLISECONDS: { description: Time duration in ms. }
      SECONDS: { description: Time duration in seconds. }
      PERCENTAGE: { description: Percentage (0–100). }
      COUNT: { description: Absolute number. }
      REQUESTS_PER_SECOND: { description: Throughput rate. }
      BYTES: { description: Data size. }
      CURRENCY: { description: Monetary value. }
      BOOLEAN: { description: Binary pass/fail. }
      LEVEL_ORDINAL: { description: "Ordinal scale (e.g., Low/Med/High)." }

  InitiativeType:
    description: >-
      The kind of Initiative. Distinguishes a discrete project from a
      programme that contains several, and from continuous/BU work.
    permissible_values:
      PROGRAM:
        description: >-
          A grouping of related projects pursued under one business case.
          May contain child Initiatives.
      PROJECT:
        description: >-
          A time-boxed piece of work with its own business case and delivery.
      WORK_ITEM:
        description: >-
          A smaller unit of work, typically under a Project.
      ENHANCEMENT:
        description: Incremental improvement to an existing capability or system.
      COMPLIANCE:
        description: >-
          Work driven primarily by a regulatory or standards obligation rather
          than a commercial opportunity.
      TECHNICAL_DEBT:
        description: >-
          Work whose business case is risk/cost reduction rather than new
          capability.

  InitiativeStatus:
    description: Lifecycle of an Initiative through business-case approval.
    permissible_values:
      PROPOSED: { description: "Business case drafted, not yet approved." }
      UNDER_REVIEW: { description: Business case in approval. }
      APPROVED: { description: "Business case approved, delivery not started." }
      IN_FLIGHT: { description: Delivery underway. }
      ON_HOLD: { description: Paused. }
      DELIVERED: { description: Outcomes realised or handed over. }
      CANCELLED: { description: Abandoned; retain for traceability. }

  ConceptAttributeDataType:
    description: >-
      The LOGICAL type of a `ConceptAttribute` — what the business means by the
      field, not what a particular store does with it.

      Deliberately logical and deliberately small. "VARCHAR(255)", "NUMBER(18,2)"
      and "TIMESTAMP WITH TIME ZONE" are PHYSICAL types: they belong to the store
      that implements the field, and they change when that store changes, so they
      cannot classify something the business owns. A logical type is what survives
      the migration, and it is the one a reviewer can check against the document.

      The extraction schema keeps `data_type` a plain string rather than a
      `Literal` on purpose (see `ExtractionRecord`'s policy on guessed
      vocabularies): a model shown a strict enum that expects `STRING` and reads
      "varchar" in the document fails at the SCHEMA level and the pass retries to
      death. The vocabulary is enforced by a deterministic check instead, which
      flags rather than refuses — the same posture `check_enum_membership` takes
      for every other classification field.
    permissible_values:
      STRING:
        description: "Free text of bounded length: a name, a code, a label."
      TEXT:
        description: Unbounded prose or a long description.
      INTEGER:
        description: Whole number.
      DECIMAL:
        description: "Exact decimal: money, rates, or a quantity with a scale."
      BOOLEAN:
        description: "True/false, yes/no, a flag."
      DATE:
        description: Calendar date without a time.
      DATETIME:
        description: A date with a time (or an instant).
      DURATION:
        description: "A length of time, not a point in it."
      IDENTIFIER:
        description: >-
          A surrogate or natural key whose meaning is its identity rather than
          its content — an account number, a payment request id.
      BINARY:
        description: "Bytes: a document, an image, a hash."

# ============================================================================
# SUBSETS (logical groupings for navigation)
# ============================================================================

subsets:

  BusinessContext:
    description: Classes describing the business environment and rationale.

  Requirements:
    description: The requirement hierarchy and direct attributes.

  QualityAttributes:
    description: Non-functional quality model.

  Traceability:
    description: Relationships that link requirements to each other and to context.

  Specification:
    description: Container and document-level constructs.

  EnterpriseStructure:
    description: Organizational constructs (Product, System, Application, Platform).

  PlatformModel:
    description: Platform-specific constructs and contracts.

# ============================================================================
# CLASSES
# ============================================================================

classes:

  # --------------------------------------------------------------------------
  # 1. SPECIFICATION CONTAINER
  # --------------------------------------------------------------------------

  RequirementSpecification:
    description: >-
      Top-level container for a complete set of requirements for a product,
      system, or project scope. Acts as the document boundary.
    tree_root: true
    attributes:
      id:
        identifier: true
        description: Unique identifier for this specification.
        range: string
        required: true
      name:
        description: Human-readable title.
        range: string
        required: true
      version:
        description: Semantic version of this specification document.
        range: string
      description:
        description: Narrative scope and purpose of this specification.
        range: string
      created_date:
        description: Date the specification was first authored.
        range: date
      last_modified_date:
        description: Date of the most recent modification.
        range: date
      status:
        description: Current lifecycle state.
        range: RequirementStatus
      stakeholders:
        description: All stakeholders associated with this specification.
        range: Stakeholder
        multivalued: true
        inlined_as_list: true
      business_goals:
        description: Strategic goals this specification serves.
        range: BusinessGoal
        multivalued: true
        inlined_as_list: true
      business_capabilities:
        description: Business capabilities in scope.
        range: BusinessCapability
        multivalued: true
        inlined_as_list: true
      business_processes:
        description: Business processes in scope.
        range: BusinessProcess
        multivalued: true
        inlined_as_list: true
      domain_concepts:
        description: Key business entities and concepts.
        range: DomainConcept
        multivalued: true
        inlined_as_list: true
      business_rules:
        description: Governing business rules.
        range: BusinessRule
        multivalued: true
        inlined_as_list: true
      requirements:
        description: All requirements in this specification.
        range: Requirement
        multivalued: true
        inlined_as_list: true
      use_cases:
        description: Use cases or user stories.
        range: UseCase
        multivalued: true
        inlined_as_list: true
      assumptions:
        description: Documented assumptions underlying this specification.
        range: Assumption
        multivalued: true
        inlined_as_list: true
      glossary_terms:
        description: Domain-specific term definitions.
        range: GlossaryTerm
        multivalued: true
        inlined_as_list: true
      # Enterprise structure references (optional — topology-aware)
      topology_type:
        description: >-
          The organizational topology. Determines whether platform constructs
          are present. Defaults to STANDALONE if not specified.
        range: EnterpriseTopologyType
      products:
        description: >-
          Products in scope for this specification. Optional — only populated
          when the specification covers product-level requirements.
        range: Product
        multivalued: true
        inlined_as_list: true
      systems:
        description: >-
          Systems in scope for this specification. Optional — only populated
          when the specification covers system-level requirements.
        range: System
        multivalued: true
        inlined_as_list: true
      applications:
        description: >-
          Applications in scope for this specification. Optional — only populated
          when the specification covers application-level requirements.
        range: Application
        multivalued: true
        inlined_as_list: true
      platforms:
        description: >-
          Platforms in scope for this specification. Optional — only populated
          when the enterprise uses a platform topology.
        range: Platform
        multivalued: true
        inlined_as_list: true
      sub_product_scopes:
        description: >-
          Feature scoping of sub-products against requirements.
          Optional — only populated when sub-products exist.
        range: SubProductScope
        multivalued: true
        inlined_as_list: true
      system_capability_bindings:
        description: >-
          Which systems are accountable for which business capabilities.
          Optional — used for capability coverage auditing.
        range: SystemCapabilityBinding
        multivalued: true
        inlined_as_list: true
      initiatives:
        description: >-
          Business cases / work items that authorise the requirements in this
          specification. Optional — populated when the source names them.
        range: Initiative
        multivalued: true
        inlined_as_list: true
    class_uri: sea-req:RequirementSpecification
    in_subset:
      - Specification

  # --------------------------------------------------------------------------
  # 2. BUSINESS CONTEXT
  # --------------------------------------------------------------------------

  Initiative:
    description: >-
      A formalised business case or work item that authorises change in the
      enterprise. The Initiative is the "why" ABOVE requirements: it states the
      justification, the sponsor, the capabilities to be created or enhanced,
      and the systems affected.
      
      It is the common root for tracing. Requirements originate from an
      Initiative; architecture answers those requirements. So business case →
      requirement → architecture is walkable as one chain, which is what makes
      the cross-verification meaningful rather than a comparison of two
      unrelated documents.
    mixins:
      - ExternallyReferenced
      - Provenanced
    attributes:
      id:
        identifier: true
        description: >-
          Stable identifier for the initiative, e.g. "INIT-2026-014". This is
          the key that requirements and architecture reference.
        range: string
        required: true
      name:
        range: string
        required: true
      description:
        range: string
      initiative_type:
        range: InitiativeType
      status:
        range: InitiativeStatus
      business_case:
        description: >-
          The justification: the problem or opportunity, expected benefit, and
          why now. The narrative that a sponsor approves.
        range: string
      sponsor:
        description: Executive or stakeholder accountable for the business case.
        range: Stakeholder
      owner:
        description: Delivery owner, if different from the sponsor.
        range: string
      cost_estimate:
        description: Indicative cost, as stated (keep the source's units).
        range: string
      approved_date:
        range: date
      target_date:
        range: date
      # --- what it pursues and delivers ---
      pursues_goals:
        description: Business goals this Initiative exists to advance.
        range: BusinessGoal
        multivalued: true
      delivers_capabilities:
        description: >-
          Capabilities this Initiative creates or enhances. The counterpart to
          BusinessCapability — capabilities exist independently of the work
          that builds them.
        range: BusinessCapability
        multivalued: true
      affects_systems:
        description: >-
          Enterprise systems this Initiative changes. Gives the link from a
          business case down to the systems it touches.
        range: System
        multivalued: true
      # --- what it originates ---
      originates_requirements:
        description: >-
          Requirements this Initiative authorises. Reverse edge:
          BusinessRequirement.originates_from.
        range: BusinessRequirement
        multivalued: true
      # --- measurable outcomes ---
      expected_outcomes:
        description: >-
          Measurable benefits expected on delivery (e.g. "reduce authorisation
          latency to <200ms at p99"). Distinct from business_case narrative —
          these are the things success is judged against.
        range: string
        multivalued: true
      # --- structure ---
      parent_initiative:
        description: Containing Initiative, for work items under a project or projects under a programme.
        range: Initiative
      depends_on_initiatives:
        description: Other Initiatives that must land first.
        range: Initiative
        multivalued: true
      constraints:
        description: Constraints the Initiative operates under (budget, regulatory, timeline).
        range: ConstraintRequirement
        multivalued: true
    class_uri: sea-req:Initiative
    in_subset:
      - BusinessContext

  Stakeholder:
    description: >-
      A person, group, or system with a vested interest in the product
      or its requirements.
    attributes:
      id:
        identifier: true
        range: string
        required: true
      name:
        range: string
        required: true
      role:
        description: The stakeholder's relationship to the system.
        range: StakeholderRole
      description:
        range: string
      organization:
        description: Organizational unit or company.
        range: string
      concerns:
        description: Key concerns or interests this stakeholder holds.
        range: string
        multivalued: true
    class_uri: sea-req:Stakeholder
    in_subset:
      - BusinessContext

  BusinessGoal:
    description: >-
      A strategic objective the product or system is intended to achieve.
      Goals justify the existence of requirements.
    attributes:
      id:
        identifier: true
        range: string
        required: true
      name:
        range: string
        required: true
      description:
        range: string
      strategic_driver:
        description: >-
          The higher-level business driver (market, competitive, regulatory)
          that motivates this goal.
        range: string
      success_criteria:
        description: >-
          Measurable indicators that determine whether the goal is achieved.
        range: string
        multivalued: true
      target_date:
        description: Expected achievement date.
        range: date
      priority:
        range: RequirementPriority
      parent_goal:
        description: For goal decomposition — links to a higher-level goal.
        range: BusinessGoal
    class_uri: sea-req:BusinessGoal
    in_subset:
      - BusinessContext

  BusinessCapability:
    description: >-
      A distinct ability the business possesses or needs to possess
      (e.g., "Order Fulfillment", "Customer Onboarding").
      Capabilities are stable; processes and systems change.
    attributes:
      id:
        identifier: true
        range: string
        required: true
      name:
        range: string
        required: true
      description:
        range: string
      capability_level:
        description: >-
          Maturity or importance level (e.g., core, enabling, emerging).
        range: string
      owner:
        description: The stakeholder or organization unit that owns this capability.
        range: Stakeholder
      sub_capabilities:
        description: Decomposition into finer-grained capabilities.
        range: BusinessCapability
        multivalued: true
        inlined_as_list: true
    class_uri: sea-req:BusinessCapability
    in_subset:
      - BusinessContext

  BusinessProcess:
    description: >-
      A structured set of activities that produces a defined business outcome.
      Processes realize capabilities.
    attributes:
      id:
        identifier: true
        range: string
        required: true
      name:
        range: string
        required: true
      description:
        range: string
      process_type:
        range: ProcessType
      trigger:
        description: What initiates this process.
        range: TriggerType
      trigger_description:
        description: Narrative description of the trigger condition.
        range: string
      entry_criteria:
        description: Conditions that must be true before the process can start.
        range: string
        multivalued: true
      exit_criteria:
        description: Conditions that confirm the process completed successfully.
        range: string
        multivalued: true
      activities:
        description: Ordered steps within this process.
        range: ProcessActivity
        multivalued: true
        inlined_as_list: true
      realizes_capability:
        description: Which business capability this process realizes.
        range: BusinessCapability
    class_uri: sea-req:BusinessProcess
    in_subset:
      - BusinessContext

  ProcessActivity:
    description: >-
      A single step or task within a business process.

      Nested-only until now: `BusinessProcess.activities` is an inlined list, so
      the class could be described and not populated, which is the shape YB-055
      named for `ConceptAttribute` and fixed there by adding a FLAT back-reference.
      `process` below is that same fix, and the same caveat applies — no extraction
      pass emits an activity record yet, so the flat shape is declared for an
      implementation to land in rather than because one exists.
    attributes:
      id:
        identifier: true
        range: string
        required: true
      name:
        range: string
        required: true
      description:
        range: string
      process:
        description: >-
          The BusinessProcess this activity belongs to, when it arrives as its own
          record rather than nested inside `BusinessProcess.activities`. An
          activity belongs to exactly one process — the same identity rule that
          makes a flat `ConceptAttribute` qualify its label with its owner.
        range: BusinessProcess
      sequence_order:
        description: Position of this activity within the process.
        range: integer
      actor:
        description: Who or what performs this activity.
        range: string
      input:
        description: What this activity consumes.
        range: string
        multivalued: true
      output:
        description: What this activity produces.
        range: string
        multivalued: true
    class_uri: sea-req:ProcessActivity
    in_subset:
      - BusinessContext

  DomainConcept:
    description: >-
      A business entity, object, or concept relevant to the domain
      (e.g., "Customer", "Invoice", "Product Catalog").
      These become the data/domain model inputs for architecture.
    attributes:
      id:
        identifier: true
        range: string
        required: true
      name:
        range: string
        required: true
      description:
        range: string
      synonyms:
        description: Alternative names or aliases used in the business.
        range: string
        multivalued: true
      key_attributes:
        description: Important properties of this concept.
        range: ConceptAttribute
        multivalued: true
        inlined_as_list: true
      relationships:
        description: How this concept relates to other concepts.
        range: ConceptRelationship
        multivalued: true
        inlined_as_list: true
    class_uri: sea-req:DomainConcept
    in_subset:
      - BusinessContext

  # --------------------------------------------------------------------------
  # 3a. EXTERNAL OBLIGATIONS — the named instruments a requirement answers to
  # --------------------------------------------------------------------------
  # Before these two classes existed, a document naming a law or an industry
  # standard had nowhere to put it: the model fell back to `Concept`, which is
  # the graph's own last resort for an unclassified referent. That is worse than
  # an empty answer, because `Concept` is indistinguishable from genuinely
  # unclassified content — a coverage census that counts these as concepts
  # reports the opposite of the truth, and a legal obligation vanishes into the
  # same bucket as a vocabulary slip.
  #
  # Both are domain entities, not requirements: GDPR and PCI-DSS v4.0 are named,
  # identifiable, versioned things OUTSIDE the system that requirements answer
  # to. `ConstraintRequirement.regulation_or_standard` states the obligation;
  # these are the thing it names.
  # --------------------------------------------------------------------------

  Regulation:
    description: >-
      A named law, regulation, directive, or treaty that the system is obliged to
      comply with — "GDPR", "HIPAA", "PCI-DSS v4.0", "PSD2". Use this for the
      instrument the document names, not for the requirement that answers it
      (`ConstraintRequirement` states the obligation; this is what it refers to).

      Prefer this over `Concept` whenever the document names a legal instrument,
      because the difference is what the compliance audit reads: obligations
      traceable to a named regulation can be checked for coverage, and the same
      names sitting in `Concept` cannot be told apart from unclassified content.
    is_a: DomainConcept
    attributes:
      jurisdiction:
        description: >-
          Legal or geographic scope the instrument applies in, as the document
          states it ("EU", "US", "EEA + UK"). Free text on purpose: jurisdictions
          are named by the sources in more ways than an enum can hold.
        range: string
      version:
        description: >-
          The version or revision the requirement is written against ("v4.0",
          "2018", "Article 17"). Omitted when the source does not say — an
          obligation without a stated version is still an obligation.
        range: string
    class_uri: sea-req:Regulation
    in_subset:
      - BusinessContext

  Standard:
    description: >-
      A named industry, technical, or internal standard the system must conform
      to — "ISO/IEC 27001", "ISO 8583", "ISO/IEC 25010", "PCI-DSS", "Open Banking
      read/write API specifications". Use this for the standard the document
      names, not for the requirement that answers it.

      Overlaps `Regulation` on purpose and the distinction is worth keeping: a
      regulation is a legal instrument, a standard is a conformance target, and
      plenty of systems must meet one without the other. Where a document treats
      an instrument as binding law, `Regulation` is the better read.
    is_a: DomainConcept
    attributes:
      issuing_body:
        description: >-
          Who publishes and maintains the standard ("ISO", "IETF", "PCI SSC",
          the organisation's own architecture board).
        range: string
      version:
        description: >-
          The version, revision, or part the requirement is written against
          ("2022", "v4.0", "part 3").
        range: string
    class_uri: sea-req:Standard
    in_subset:
      - BusinessContext

  ConceptAttribute:
    description: >-
      A property or field of a domain concept — the LOGICAL data model.

      It has always been declared, and it has never had an instance, because
      `DomainConcept.key_attributes` is `inlined_as_list`: a nested object list,
      while the extraction contract is flat (entity records plus triples). A
      nested slot is a field the pipeline can describe and cannot populate —
      YB-055.

      The class now has a second, FLAT shape. Its owner is named by the
      `concept` slot and it arrives as its own record, so the two shapes are:

        nested  DomainConcept.key_attributes -> [ConceptAttribute]   (declared)
        flat    ConceptAttribute.concept     -> DomainConcept        (emitted)

      Both are kept on purpose. The nested slot is what a hand-written data model
      looks like and it stays for that use; the flat slot is what extraction can
      actually produce and what ingest materialises, and it is the one a query
      walks. An attribute emitted flat is still an attribute of exactly one
      concept — that is the identity rule, not a preference: the same field name
      under two concepts ("Customer.email", "Order.email") is two different
      fields, which is why ingest qualifies the node label with the owner rather
      than trusting the bare name.
    attributes:
      name:
        range: string
        required: true
      concept:
        description: >-
          The concept this attribute belongs to. Carried explicitly in the flat
          form; implied by the parent in the nested form, where it is left empty
          because restating it is how the two get to disagree.
        range: DomainConcept
      description:
        range: string
      data_type:
        description: >-
          The LOGICAL type of the field, from `ConceptAttributeDataType`. Free
          text in the schema because a document often states a physical type
          ("VARCHAR(255)") and a strict enum would reject the whole extraction
          rather than flag one field; `check_concept_attributes` reports a value
          outside this vocabulary as a finding.
        range: string
      is_required:
        description: Whether this attribute is mandatory.
        range: boolean
      constraints:
        description: Validation rules or restrictions.
        range: string
        multivalued: true
    class_uri: sea-req:ConceptAttribute
    in_subset:
      - BusinessContext

  ConceptRelationship:
    description: A named relationship between two domain concepts.
    attributes:
      name:
        range: string
        required: true
      description:
        range: string
      source_concept:
        description: The concept this relationship originates from.
        range: DomainConcept
      target_concept:
        description: The concept this relationship points to.
        range: DomainConcept
      cardinality:
        description: >-
          Multiplicity (e.g., "1..*", "0..1", "1..1").
        range: string
      relationship_type:
        description: >-
          Nature of the relationship (e.g., "has", "belongs_to",
          "references", "composed_of").
        range: string
    class_uri: sea-req:ConceptRelationship
    in_subset:
      - BusinessContext

  BusinessRule:
    description: >-
      A specific, testable directive that governs some aspect of the business.
      Rules constrain behavior and are referenced by requirements.
    attributes:
      id:
        identifier: true
        range: string
        required: true
      name:
        range: string
        required: true
      description:
        range: string
        required: true
      rule_expression:
        description: >-
          Formal or semi-formal expression of the rule
          (e.g., "IF order_total > 10000 THEN requires_approval = true").
        range: string
      rule_type:
        description: Category of rule.
        range: string
        examples:
          - value: FACT
          - value: CONSTRAINT
          - value: INFERENCE
          - value: COMPUTATION
      severity:
        description: Consequence of violation.
        range: ImpactLevel
    class_uri: sea-req:BusinessRule
    in_subset:
      - BusinessContext

  # --------------------------------------------------------------------------
  # 3. REQUIREMENT HIERARCHY
  # --------------------------------------------------------------------------

  Requirement:
    description: >-
      Abstract base class for all requirements. Concrete subtypes specialize
      by category (business, functional, non-functional, constraint).
      
      ExternallyReferenced because requirements almost always live in tooling
      too (Jira, Azure DevOps, DOORS) and that key is what the enterprise
      actually cites. Provenanced because an extracted requirement and a
      human-ratified one must not look alike in the graph.
    abstract: true
    mixins:
      - ExternallyReferenced
      - Provenanced
    attributes:
      id:
        identifier: true
        description: Unique requirement identifier (e.g., REQ-001).
        range: string
        required: true
      name:
        description: Short title.
        range: string
        required: true
      description:
        description: >-
          Clear, unambiguous statement of the requirement.
          Should follow "The system shall..." convention for functional reqs.
        range: string
        required: true
      requirement_type:
        description: Classification of this requirement.
        range: RequirementType
        required: true
      priority:
        range: RequirementPriority
      status:
        range: RequirementStatus
      rationale:
        description: Why this requirement exists.
        range: string
      acceptance_criteria:
        description: >-
          Testable conditions that confirm the requirement is satisfied.
        range: string
        multivalued: true
      source:
        description: Origin of this requirement (document, interview, regulation).
        range: string
      assigned_stakeholders:
        description: Stakeholders who requested or own this requirement.
        range: Stakeholder
        multivalued: true
      traces_to_goals:
        description: Which business goals this requirement serves.
        range: BusinessGoal
        multivalued: true
      traces_to_capabilities:
        description: Which business capabilities this requirement supports.
        range: BusinessCapability
        multivalued: true
      traces_to_processes:
        description: Which business processes this requirement enables.
        range: BusinessProcess
        multivalued: true
      governed_by_rules:
        description: Business rules that constrain this requirement.
        range: BusinessRule
        multivalued: true
      depends_on:
        description: Other requirements that must be satisfied first.
        range: Requirement
        multivalued: true
      conflicts_with:
        description: Requirements that tension or contradict this one.
        range: Requirement
        multivalued: true
      refines:
        description: Finer-grained decomposition of a parent requirement.
        range: Requirement
        multivalued: true
      assumptions:
        description: Assumptions this requirement depends on.
        range: Assumption
        multivalued: true
      notes:
        description: Free-form annotations or open questions.
        range: string
        multivalued: true
      # Enterprise structure bindings (optional — topology-aware)
      binds_to_product:
        description: >-
          The product this requirement is scoped to. Optional.
          BusinessRequirements typically bind here.
        range: Product
        multivalued: true
      binds_to_system:
        description: >-
          The system this requirement targets. Optional.
          Functional and NonFunctionalRequirements typically bind here.
        range: System
        multivalued: true
      binds_to_application:
        description: >-
          The application this requirement targets. Optional.
          Implementation-level requirements bind here.
        range: Application
        multivalued: true
      binds_to_platform:
        description: >-
          The platform this requirement targets. Optional.
          Only populated when a platform topology is in use.
        range: Platform
        multivalued: true
      derives_from:
        description: >-
          Cross-altitude derivation. This requirement was derived from
          a higher-level requirement (e.g., a BusinessRequirement at the
          Product level deriving an NFR at the System level).
        range: Requirement
        multivalued: true
    class_uri: sea-req:Requirement
    in_subset:
      - Requirements

  BusinessRequirement:
    description: >-
      A high-level requirement expressing a business need.
      Typically maps to a business goal or capability.
    is_a: Requirement
    attributes:
      business_justification:
        description: ROI or value statement justifying this requirement.
        range: string
      impact_if_not_met:
        description: What happens if this requirement is not fulfilled.
        range: ImpactLevel
      target_metrics:
        description: >-
          Business-level metrics this requirement aims to influence
          (e.g., "reduce churn by 15%").
        range: string
        multivalued: true
      originates_from:
        description: >-
          The Initiative (business case / work item) that authorises this
          requirement. This is the upward edge to the business case — the top of
          the business case → requirement → architecture chain.
        range: Initiative
        multivalued: true
    class_uri: sea-req:BusinessRequirement
    in_subset:
      - Requirements

  FunctionalRequirement:
    description: >-
      A behavioral requirement — what the system must do.
      Describes functions, interactions, and data handling.
    is_a: Requirement
    attributes:
      use_case:
        description: The use case this requirement realizes.
        range: UseCase
      functional_area:
        description: >-
          Logical grouping (e.g., "Authentication", "Reporting",
          "Data Management").
        range: string
      interaction_type:
        description: Kind of system interaction.
        range: string
        examples:
          - value: USER_INPUT
          - value: SYSTEM_EVENT
          - value: API_CALL
          - value: BATCH_JOB
          - value: NOTIFICATION
      preconditions:
        description: Conditions that must hold before this function executes.
        range: string
        multivalued: true
      postconditions:
        description: Conditions guaranteed after successful execution.
        range: string
        multivalued: true
      business_objects_involved:
        description: Domain concepts this function operates on.
        range: DomainConcept
        multivalued: true
    class_uri: sea-req:FunctionalRequirement
    in_subset:
      - Requirements

  NonFunctionalRequirement:
    description: >-
      A requirement specifying a quality attribute the system must exhibit.
      Aligned with ISO/IEC 25010:2023.
    is_a: Requirement
    attributes:
      realizes_attribute:
        description: >-
          The `QualityAttribute` this requirement is about — the primary link.
          A requirement is a DOCUMENTED INSTANCE; the attribute is the abstract
          concern, and pointing at the concern is what lets two NFRs about the
          same attribute (a latency NFR and a throughput NFR, both Time
          Behaviour) be recognised as concerning one thing, and lets a technique
          be justified by an attribute no requirement states.
        range: QualityAttribute
      quality_category:
        description: >-
          ISO 25010:2023 top-level characteristic. Retained alongside
          `realizes_attribute` so the classification survives even when the
          specific attribute node has not been materialised — extraction can
          always fill an enum, and only sometimes resolve a node.
        range: QualityAttributeCategory
      subcharacteristic:
        description: >-
          The precise sub-characteristic the requirement targets. This is the
          field that separates "within 500ms" (Time Behaviour) from "1000 TPS
          with horizontal scaling" (Scalability), which the top-level
          characteristic alone cannot do.
        range: QualitySubcharacteristic
      quality_scenario:
        description: The concrete quality scenario this requirement addresses.
        range: QualityScenario
      measurable:
        description: Whether this NFR has quantified targets.
        range: boolean
        required: true
      target_value:
        description: The quantitative target (if measurable).
        range: string
      threshold_value:
        description: The minimum acceptable value before violation.
        range: string
      measurement_unit:
        description: Unit of measurement for the target.
        range: MeasurementUnit
      measurement_method:
        description: How the quality attribute is measured or observed.
        range: string
    class_uri: sea-req:NonFunctionalRequirement
    in_subset:
      - Requirements
      - QualityAttributes
      - Traceability

  ConstraintRequirement:
    description: >-
      A non-negotiable restriction on the system's design or implementation.
      Unlike NFRs, constraints are binary — either met or violated.
    is_a: Requirement
    attributes:
      constraint_type:
        range: ConstraintType
        required: true
      regulation_or_standard:
        description: >-
          The specific regulation, law, or standard being referenced, VERBATIM as
          the source cites it (e.g., "GDPR Article 17", "PCI-DSS v4.0 Req 3.4").

          This is the extraction-time linkage, in the same shape as
          `ArchitectureElement.requirement_refs`: it survives a document that
          cites an instrument without naming it as an entity. The resolved edges
          below are what make compliance a query rather than a reading exercise.
        range: string
      regulation_refs:
        description: >-
          Identifiers of the named regulations this constraint answers, as cited
          in the source ("GDPR", "PSD2"). Matched against `Regulation` during
          reconciliation, in the same two-step shape `requirement_refs` and
          `implements_requirements` use.
        range: string
        multivalued: true
      standard_refs:
        description: >-
          Identifiers of the named standards this constraint conforms to, as
          cited in the source ("ISO/IEC 27001", "PCI-DSS v4.0").
        range: string
        multivalued: true
      regulations:
        description: >-
          Resolved `Regulation` objects this constraint answers. Populated during
          reconciliation, when `regulation_refs` have been matched against the
          governance layer. Prefer `regulation_refs` at extraction time, since
          the instruments may not be resolvable yet.

          Without this edge `Regulation` was ranged over by NOTHING in any layer
          while being defined here, so the "traceable to a named regulation"
          compliance walk had no join to make — a class declared and never
          pointed at, which is indistinguishable from one that does not exist.
        range: Regulation
        multivalued: true
      standards:
        description: >-
          Resolved `Standard` objects this constraint conforms to. Populated
          during reconciliation, when `standard_refs` have been matched.
        range: Standard
        multivalued: true
      jurisdiction:
        description: Legal or geographic jurisdiction (if applicable).
        range: string
      effective_date:
        description: When this constraint takes or took effect.
        range: date
      penalty_if_violated:
        description: Consequence of non-compliance.
        range: string
    class_uri: sea-req:ConstraintRequirement
    in_subset:
      - Requirements

  # --------------------------------------------------------------------------
  # 4. USE CASES
  # --------------------------------------------------------------------------

  UseCase:
    description: >-
      A description of an interaction between an actor and the system
      that yields a measurable business outcome.

      NOTE: declared but never populated. The requirements extraction vocabulary
      (`knowledge_extraction/agent.py`) does not name it, so no run emits one and
      every slot below is empty on every graph. The coverage census reports it as
      a zero-instance class, which is correct rather than a defect — recorded here
      for the same reason `QualityScenario` is: the shape is what an
      implementation would have to produce.
    attributes:
      id:
        identifier: true
        range: string
        required: true
      name:
        range: string
        required: true
      description:
        range: string
      actor:
        description: Primary actor initiating this use case.
        range: Actor
      secondary_actors:
        description: Other actors involved.
        range: Actor
        multivalued: true
      precondition:
        description: State required before the use case can begin.
        range: string
        multivalued: true
      main_flow:
        description: The happy-path sequence of steps.
        range: UseCaseStep
        multivalued: true
        inlined_as_list: true
      alternative_flows:
        description: Branching or exceptional flows.
        range: AlternativeFlow
        multivalued: true
        inlined_as_list: true
      postcondition:
        description: State guaranteed after successful completion.
        range: string
        multivalued: true
      business_rules_applied:
        description: Rules governing this use case.
        range: BusinessRule
        multivalued: true
    class_uri: sea-req:UseCase
    in_subset:
      - BusinessContext
      - Requirements

  Actor:
    description: >-
      An external entity (human or system) that interacts with the system.

      NOTE: declared but never populated — see `UseCase`. Stakeholders ARE
      extracted; actors, who are the use-case layer's other half, are not.
    attributes:
      id:
        identifier: true
        range: string
        required: true
      name:
        range: string
        required: true
      description:
        range: string
      actor_type:
        description: Whether this is a human user, external system, or device.
        range: string
        examples:
          - value: PRIMARY_HUMAN
          - value: SECONDARY_HUMAN
          - value: EXTERNAL_SYSTEM
          - value: TIME_TRIGGER
    class_uri: sea-req:Actor
    in_subset:
      - BusinessContext

  UseCaseStep:
    description: >-
      A single step in a use case's main flow.

      Nested-only, like `ProcessActivity`: `UseCase.main_flow` is an inlined list.
      `use_case` below is the flat back-reference (YB-055's fix, applied here),
      declared so an implementation has somewhere to land — nothing emits a step
      record today.
    attributes:
      step_number:
        range: integer
        required: true
      actor_action:
        description: What the actor does.
        range: string
      system_response:
        description: How the system responds.
        range: string
      use_case:
        description: >-
          The UseCase this step belongs to, when it arrives flat rather than
          nested inside `main_flow`.
        range: UseCase
    class_uri: sea-req:UseCaseStep
    in_subset:
      - BusinessContext

  AlternativeFlow:
    description: >-
      A branching path from the main use case flow.

      Nested-only, and reached two ways: `UseCase.alternative_flows` and
      `AlternativeFlow.steps` (which ranges back over `UseCaseStep`). `use_case`
      below is the flat back-reference, the YB-055 shape applied here.
    attributes:
      id:
        identifier: true
        range: string
        required: true
      name:
        range: string
        required: true
      use_case:
        description: >-
          The UseCase this flow branches from, when it arrives flat rather than
          nested inside `alternative_flows`.
        range: UseCase
      trigger_condition:
        description: What causes the branch to execute.
        range: string
      steps:
        range: UseCaseStep
        multivalued: true
        inlined_as_list: true
      resolution:
        description: How the alternative flow concludes or rejoins the main flow.
        range: string
    class_uri: sea-req:AlternativeFlow
    in_subset:
      - BusinessContext

  # --------------------------------------------------------------------------
  # 5. QUALITY ATTRIBUTE MODEL
  # --------------------------------------------------------------------------
  #
  # The ISO/IEC 25010:2023 taxonomy, materialised as nodes.
  #
  # WHY A CLASS AND NOT JUST THE ENUMS. An enum value is not a thing anything can
  # point at. Without this class, `DesignTechnique.realizes_quality_attributes`
  # and `ArchitectureElement.satisfies_quality_attributes` had to range over
  # `NonFunctionalRequirement` — a *documented instance* — with three costs:
  #
  #   1. A technique could only be justified by an attribute some requirement
  #      happened to state. Redundancy is good practice even when nobody wrote an
  #      availability NFR, and that coverage gap is the interesting case.
  #   2. Two NFRs about the same attribute (a latency NFR and a throughput NFR,
  #      both Time Behaviour) could not be recognised as concerning ONE attribute.
  #   3. `quality_category` was a bare string with nowhere to hang a scenario,
  #      evidence, or a verdict.
  #
  # A QualityAttribute is a claim about a NICE PROPERTY, explicitly NOT a
  # mechanism ("Availability", never "Redundancy"). The mechanism is a
  # DesignTechnique whose `realizes_quality_attributes` points here — keeping the
  # what and the how in separate node types, which is what lets the auditor ask
  # *which* techniques address Availability rather than reading prose.

  QualityAttribute:
    description: >-
      A quality attribute the enterprise cares about, from the ISO/IEC 25010:2023
      model or the enterprise-governance extension. The TOP-LEVEL
      characteristics (Reliability) and their sub-characteristics (Availability,
      Fault Tolerance) are both instances of this class, related by `is_a`, so
      the taxonomy is a graph rather than a flat list.

      Populate from the ISO seed catalogue rather than inventing names — a
      quality attribute is a standard term of art, and a synonym here silently
      splits the very taxonomy this class exists to provide.
    attributes:
      id:
        identifier: true
        range: string
        required: true
      name:
        description: >-
          The attribute as the standard names it, e.g. "Reliability",
          "Availability", "Time Behaviour", "Scalability".
        range: string
        required: true
      description:
        range: string
      characteristic:
        description: The ISO 25010:2023 top-level characteristic this belongs to.
        range: QualityAttributeCategory
        required: true
      subcharacteristic:
        description: >-
          The specific sub-characteristic, where this node is one. Empty for a
          top-level characteristic node.
        range: QualitySubcharacteristic
      concern_class:
        description: >-
          Which quality model the characteristic comes from. Keeps the ISO claim
          honest, since REGULATORY_COMPLIANCE is not an ISO 25010 characteristic.
        range: QualityConcernClass
      parent_attribute:
        description: >-
          The broader attribute this specialises, where `is_a` is not used.
          Declared explicitly as well as in the class hierarchy so a project can
          hang organisation-specific attributes under a standard one without
          editing the ontology.
        range: QualityAttribute
      definition_source:
        description: Where the definition came from — the standard clause, or the internal policy.
        range: string
      scenarios:
        description: Concrete ATAM scenarios that operationalise this attribute.
        range: QualityScenario
        multivalued: true
        inlined_as_list: true
      stated_in_requirements:
        description: >-
          The requirements that state this attribute. Reverse of
          `NonFunctionalRequirement.realizes_attribute`; populated at ingest or
          reconciliation, not asserted by extraction.
        range: NonFunctionalRequirement
        multivalued: true
      realized_by:
        description: >-
          NAMES of architecture elements that deliver this attribute — a
          cross-graph reference into ARC-G, kept as a string because
          `ArchitectureElement` lives in a layer ABOVE this one and a class range
          would invert the one-way import rule. Same treatment as
          `DesignTechnique.realised_by` in the domain pack: reconciled at the
          graph level, not baked into the schema.

          This is the attribute-level counterpart of `RequirementRealization`,
          and the link that still works when no requirement states the attribute
          at all.
        range: string
        multivalued: true
      realized_by_techniques:
        description: >-
          NAMES of the mechanisms that deliver this attribute — the reverse of
          `DesignTechnique.realizes_quality_attributes`, kept as a cross-graph
          reference for the same layering reason. This is the slot that answers
          "which techniques address Availability?" directly.
        range: string
        multivalued: true
      covered:
        description: >-
          Whether anything in the graph addresses this attribute —
          "realized", "partial", "planned", "not_addressed", "not_assessed".
          Kept as a value rather than an enum so an unrecognised state from a
          source survives, the same posture as extraction statuses elsewhere.
        range: string
      coverage_note:
        description: Why coverage is what it is, and what is missing.
        range: string
    class_uri: sea-req:QualityAttribute
    in_subset:
      - QualityAttributes
      - Traceability

  QualityScenario:
    description: >-
      A concrete quality scenario following the ATAM pattern:
      stimulus-source → stimulus → environment → artifact → response → measure.
      Used to make NFRs testable and unambiguous.

      NOTE: declared but never populated. No extraction pass emits it and no
      prompt mentions it, so every slot below is currently empty on every graph.
      Recorded here rather than removed because the ATAM pattern is the intended
      way to make an NFR falsifiable, and the shape is what an implementation
      would have to produce.
    attributes:
      id:
        identifier: true
        range: string
        required: true
      name:
        range: string
        required: true
      description:
        range: string
      attribute:
        description: >-
          The quality attribute this scenario operationalises. Without it a
          scenario cannot be matched to the attribute it measures, which is why
          it is worth naming even while the class is unpopulated.
        range: QualityAttribute
      stimulus_source:
        description: Who or what generates the stimulus (e.g., "end user", "attacker").
        range: string
        required: true
      stimulus:
        description: The event or condition (e.g., "submits a 10,000-row query").
        range: string
        required: true
      environment:
        description: >-
          The operating conditions (e.g., "peak load", "network partition",
          "normal operation").
        range: string
        required: true
      artifact:
        description: Which part of the system is affected.
        range: string
      response:
        description: The desired system response.
        range: string
        required: true
      response_measure:
        description: >-
          How the response is quantified (e.g., "latency < 200ms at p99").
        range: string
        required: true
    class_uri: sea-req:QualityScenario
    in_subset:
      - QualityAttributes

  # --------------------------------------------------------------------------
  # 6. SUPPORTING CONSTRUCTS
  # --------------------------------------------------------------------------

  Assumption:
    description: >-
      A factor believed to be true for the purposes of this specification,
      but not yet verified. Risks if proven false.

      NOTE: declared but never populated. Nothing in the extraction vocabulary
      names it, so the census reports it zero-instance.
    attributes:
      id:
        identifier: true
        range: string
        required: true
      statement:
        description: The assumption being made.
        range: string
        required: true
      confidence:
        description: How confident we are this holds (Low / Medium / High).
        range: string
      risk_if_false:
        description: Impact if this assumption is invalid.
        range: ImpactLevel
      validation_method:
        description: How we can verify this assumption.
        range: string
    class_uri: sea-req:Assumption
    in_subset:
      - Specification

  GlossaryTerm:
    description: >-
      A domain-specific term with a precise definition.

      NOTE: declared but never populated. Nothing in the extraction vocabulary
      names it, so the census reports it zero-instance. Distinct from
      `DomainConcept`, which IS extracted: a glossary term is a definition, a
      domain concept is a thing the business reasons about.
    attributes:
      term:
        identifier: true
        range: string
        required: true
      definition:
        range: string
        required: true
      abbreviation:
        range: string
      see_also:
        description: Related terms.
        range: string
        multivalued: true
    class_uri: sea-req:GlossaryTerm
    in_subset:
      - Specification

  # --------------------------------------------------------------------------
  # 7. PLATFORM-SPECIFIC REQUIREMENT TYPES
  # --------------------------------------------------------------------------
  # These requirement types are only applicable when a Platform construct
  # exists. They capture platform-level concerns that don't fit into
  # standard business/functional/non-functional categories.
  # --------------------------------------------------------------------------

  PlatformExtensibilityRequirement:
    description: >-
      A requirement on the platform's extensibility — what the platform
      must expose for Products/Applications to build on it.
      Only applicable when a Platform construct exists.
    is_a: NonFunctionalRequirement
    attributes:
      target_platform:
        description: The platform this extensibility requirement targets.
        range: Platform
        required: true
      extensibility_mechanism:
        description: >-
          The mechanism through which extensibility is provided
          (e.g., "REST API", "webhook", "plugin SDK", "event bus").
        range: PlatformContractType
      extender_profile:
        description: >-
          Who the extensibility is for (e.g., "third-party developer",
          "internal team", "partner").
        range: string
      integration_complexity_target:
        description: >-
          Target complexity for integration (e.g., "new integration
          deployable within 4 hours", "fewer than 10 API calls to
          complete core workflow").
        range: string
    class_uri: sea-req:PlatformExtensibilityRequirement
    in_subset:
      - Requirements
      - PlatformModel
      - QualityAttributes

  PlatformMultiTenancyRequirement:
    description: >-
      A requirement on tenant isolation, data segregation, and
      resource sharing within a platform.
      Only applicable when a Platform construct exists.
    is_a: NonFunctionalRequirement
    attributes:
      target_platform:
        description: The platform this multi-tenancy requirement targets.
        range: Platform
        required: true
      isolation_level:
        description: >-
          Required isolation level (e.g., "logical isolation",
          "dedicated compute", "dedicated storage", "full stack isolation").
        range: string
      data_segregation_model:
        description: >-
          How tenant data is segregated (e.g., "shared database with
          tenant_id column", "schema-per-tenant", "database-per-tenant").
        range: string
      tenant_capacity:
        description: >-
          Expected number of tenants and scale per tenant.
        range: string
      cross_tenant_isolation:
        description: >-
          Whether any cross-tenant data access is permitted
          (e.g., "strict isolation", "opt-in sharing").
        range: string
    class_uri: sea-req:PlatformMultiTenancyRequirement
    in_subset:
      - Requirements
      - PlatformModel
      - QualityAttributes

  PlatformCompatibilityRequirement:
    description: >-
      A requirement on backward compatibility and contract stability
      of a platform's APIs and contracts.
      Only applicable when a Platform construct exists.
    is_a: NonFunctionalRequirement
    attributes:
      target_platform:
        description: The platform this compatibility requirement targets.
        range: Platform
        required: true
      target_contract:
        description: The specific contract this requirement applies to.
        range: PlatformContract
      compatibility_window:
        description: >-
          How long backward compatibility is guaranteed
          (e.g., "24 months", "2 major versions", "indefinite for stable APIs").
        range: string
      breaking_change_policy:
        description: >-
          Policy for introducing breaking changes
          (e.g., "6 months deprecation notice", "versioned endpoints",
          "feature flags for gradual rollout").
        range: string
      migration_support:
        description: >-
          What migration support the platform provides
          (e.g., "automated migration tools", "dual-run period",
          "manual migration guide").
        range: string
    class_uri: sea-req:PlatformCompatibilityRequirement
    in_subset:
      - Requirements
      - PlatformModel
      - QualityAttributes

  # --------------------------------------------------------------------------
  # 8. ENTERPRISE ↔ REQUIREMENT BINDINGS
  # --------------------------------------------------------------------------
  # Links that span the enterprise_structure / requirements boundary.
  # These live HERE (not in enterprise_structure.yaml) because they reference
  # Requirement, which would create a circular import if declared in the
  # enterprise structure ontology.
  #
  # Layering rule:
  #   enterprise_structure.yaml  (no dependencies — base layer)
  #        ↑ imported by
  #   requirements_base.yaml     (may reference enterprise constructs)
  #        ↑ imported by
  #   architecture_base.yaml     (future — may reference both)
  # --------------------------------------------------------------------------

  SubProductScope:
    description: >-
      Defines which requirements a SubProduct includes or excludes.
      Sub-products are feature-scoped slices of a parent Product —
      this binding class records that scope explicitly.

      NOTE: declared but never populated. Nothing in the extraction vocabulary
      names it, so the census reports it zero-instance.
    attributes:
      sub_product:
        description: The sub-product whose scope is being defined.
        range: SubProduct
        required: true
      included_requirements:
        description: Requirements active in this sub-product's scope.
        range: Requirement
        multivalued: true
      excluded_requirements:
        description: Requirements explicitly out of scope for this sub-product.
        range: Requirement
        multivalued: true
      scope_rationale:
        description: Why this scope was chosen (segment, pricing, licensing).
        range: string
    class_uri: sea-req:SubProductScope
    in_subset:
      - Requirements
      - EnterpriseStructure

  SystemCapabilityBinding:
    description: >-
      Links a System to the BusinessCapabilities it is accountable for
      delivering. Complements the requirement-side slot
      `Requirement.traces_to_capabilities` by making the system's
      capability ownership explicit (useful for coverage/gap auditing).

      NOTE: declared but never populated. Nothing in the extraction vocabulary
      names it, so the census reports it zero-instance — which is why the
      capability-coverage audit currently reads the requirement side only.
    attributes:
      system:
        description: The system that delivers the capability.
        range: System
        required: true
      capability:
        description: The business capability the system is accountable for.
        range: BusinessCapability
        required: true
      coverage_level:
        description: >-
          How fully the system covers this capability
          (e.g., "full", "partial", "planned", "none").
        range: string
    class_uri: sea-req:SystemCapabilityBinding
    in_subset:
      - Requirements
      - EnterpriseStructure
